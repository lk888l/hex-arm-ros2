# First supervised hardware commissioning profile. These narrow positions are
# anchored on the surveyed startup pose q=[0, -1.570, 1.570, 0, 0, 0]. The
# joint_6 upper edge also includes the verified 2026-08-18 passive reading at
# 0.285820 rad. These are intentionally not the final URDF travel limits. The
# Rust hardware profile remains the independent authority and uses the same
# 0.1 rad/s commissioning cap.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 0.1

joint_limits:
  joint_1:
    has_position_limits: true
    min_position: -0.25
    max_position: 0.25
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.1
  joint_2:
    has_position_limits: true
    min_position: -1.57
    max_position: -1.30
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.1
  joint_3:
    has_position_limits: true
    min_position: 1.28
    max_position: 1.57
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.1
  joint_4:
    has_position_limits: true
    # Includes the requested -0.300 rad startup pose.
    min_position: -0.35
    max_position: 0.25
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.1
  joint_5:
    has_position_limits: true
    min_position: -0.25
    max_position: 0.25
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.1
  joint_6:
    has_position_limits: true
    min_position: -0.25
    max_position: 0.35
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.1
