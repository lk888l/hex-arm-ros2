controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    firefly_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

firefly_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      joint_1: {trajectory: 0.15, goal: 0.05}
      joint_2: {trajectory: 0.15, goal: 0.05}
      joint_3: {trajectory: 0.15, goal: 0.05}
      joint_4: {trajectory: 0.15, goal: 0.05}
      joint_5: {trajectory: 0.15, goal: 0.05}
      joint_6: {trajectory: 0.15, goal: 0.05}

