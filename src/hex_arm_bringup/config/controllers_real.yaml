# The Rust interpolator and MIT damping need the trajectory velocity too.
# Position-only streaming supplies a zero endpoint velocity every 10 ms,
# repeatedly stretching segments under acceleration limits and causing lag.
firefly_arm_controller:
  ros__parameters:
    command_interfaces: [position, velocity]
    # Keep a continuous reference when compliant MIT joints have a small
    # measured holding error. Hardware activation seeds commands from feedback.
    # Measured feedback still drives the normal path/goal tolerance checks.
    interpolate_from_desired_state: true
    # User-authorized settled acceptance of 0.015 rad, 2026-09-30.
    # Transient path tolerance remains 0.04 rad.
    constraints:
      joint_1: {trajectory: 0.04, goal: 0.015}
      joint_2: {trajectory: 0.04, goal: 0.015}
      joint_3: {trajectory: 0.04, goal: 0.015}
      joint_4: {trajectory: 0.04, goal: 0.015}
      joint_5: {trajectory: 0.04, goal: 0.015}
      joint_6: {trajectory: 0.04, goal: 0.015}
