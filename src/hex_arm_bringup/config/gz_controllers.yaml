controller_manager:
  ros__parameters:
    update_rate: 250
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    firefly_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

firefly_arm_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.08
      goal_time: 2.0
      joint_1: {trajectory: 0.20, goal: 0.08}
      joint_2: {trajectory: 0.20, goal: 0.08}
      joint_3: {trajectory: 0.20, goal: 0.08}
      joint_4: {trajectory: 0.20, goal: 0.08}
      joint_5: {trajectory: 0.20, goal: 0.08}
      joint_6: {trajectory: 0.20, goal: 0.08}

