[package]
name = "hex_arm_controller"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
can-transport = { version = "=0.1.2", features = ["gs_usb"] }
clap = { version = "4.5", features = ["derive"] }
hex-arm-dynamics = "=0.1.0"
hex-motor = { path = "vendor/hex-motor" }
parking_lot = "0.12"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = "=1.9.0"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.2"

[dev-dependencies]
approx = "0.5"
tempfile = "3.20"

