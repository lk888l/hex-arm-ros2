syntax = "proto3";
package robot_api;

// Wire-compatible subset of hex-robot-proto at
// e52860ad1226af49b46f702033d9eb94fa17248e. Driver extensions use new message
// names and field numbers, so existing robot_api consumers remain compatible.

message ApiVersion { uint32 major = 1; uint32 minor = 2; uint32 patch = 3; }
message Header { uint64 seq = 1; int64 stamp_ns = 2; optional int64 sync_ns = 3; }
message Vec3 { float x = 1; float y = 2; float z = 3; }

enum RobotKind {
  ROBOT_KIND_UNSPECIFIED = 0;
  ROBOT_KIND_ARM = 1;
  ROBOT_KIND_BASE = 2;
  ROBOT_KIND_LIFT = 3;
  ROBOT_KIND_EE = 4;
}
enum OperatingMode {
  OPERATING_MODE_UNSPECIFIED = 0;
  OPERATING_MODE_DISABLED = 1;
  OPERATING_MODE_ACTIVE = 2;
  OPERATING_MODE_PASSIVE = 3;
  OPERATING_MODE_GRAVITY_COMP = 4;
  OPERATING_MODE_FAULT = 100;
  OPERATING_MODE_CALIBRATING = 101;
}
enum RobotMode {
  ROBOT_MODE_UNSPECIFIED = 0;
  ROBOT_MODE_STANDBY = 1;
  ROBOT_MODE_RUNNING = 2;
  ROBOT_MODE_OVERTAKEN = 3;
  ROBOT_MODE_FATAL_ERROR = 4;
}
enum TimeoutBehavior {
  TIMEOUT_BEHAVIOR_UNSPECIFIED = 0;
  TIMEOUT_BEHAVIOR_HOLD = 1;
  TIMEOUT_BEHAVIOR_RAMP_STOP = 2;
  TIMEOUT_BEHAVIOR_FAULT = 3;
  TIMEOUT_BEHAVIOR_SHORT_BRAKE = 4;
}
enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_WARNING = 2;
  EVENT_SEVERITY_ERROR = 3;
  EVENT_SEVERITY_FATAL = 4;
}

message GenericResponse { bool ok = 1; optional string error = 2; }
message Event { Header header = 1; EventSeverity severity = 2; string code = 3; string text = 4; map<string, string> kv = 5; }
message EventLog { repeated Event events = 1; }
message RobotDescription {
  string robot_index = 1;
  RobotKind kind = 2;
  string model = 3;
  ApiVersion api_version = 4;
  repeated string device_keys = 5;
  repeated OperatingMode supported_modes = 6;
  optional string urdf_key = 7;
}
message RobotStatus {
  Header header = 1;
  RobotMode mode = 2;
  uint32 session_holder = 3;
}
message AcquireSessionRequest { optional string client_name = 1; optional string liveliness_key = 2; }
message AcquireSessionResponse {
  bool ok = 1;
  uint32 session_id = 2;
  optional string error = 3;
  uint32 current_holder = 4;
  optional string current_holder_name = 5;
}
message ReleaseSessionRequest { uint32 session_id = 1; }
message SetModeRequest { uint32 session_id = 1; OperatingMode mode = 2; }
message ClearFaultRequest { uint32 session_id = 1; }

message JointState {
  Header header = 1;
  repeated float q = 2;
  repeated float dq = 3;
  repeated float tau_est = 4;
  repeated float temp = 5;
}
message JointSetpoint {
  repeated float q = 1;
  repeated float dq = 2;
  repeated float kp = 3;
  repeated float kd = 4;
  repeated float tau_ff = 5;
}
message JointTrajectory {
  Header header = 1;
  uint32 session_id = 2;
  repeated JointSetpoint points = 3;
  repeated int64 t_from_start_ns = 4;
  TimeoutBehavior on_timeout = 5;
}
message ArmDescription {
  uint32 dof = 1;
  repeated string joint_names = 2;
  repeated float pos_min = 3;
  repeated float pos_max = 4;
  repeated float vel_max = 5;
  repeated float tau_max = 6;
  repeated float default_kp = 7;
  repeated float default_kd = 8;
  repeated string motor_models = 9;
  repeated TimeoutBehavior supported_timeouts = 10;
  optional float total_power_max_w = 20;
  optional float thermal_derate_temp = 21;
}
message UrdfResource {
  string xml = 1;
  string root_link = 2;
  string tip_link = 3;
  optional bytes xml_gz = 4;
  repeated string mount_links = 5;
}
message SetGravityRequest { uint32 session_id = 1; Vec3 gravity = 2; }

message MotorIdentity {
  uint32 node_id = 1;
  uint32 vendor_id = 2;
  uint32 product_code = 3;
  uint32 revision = 4;
  uint32 serial_number = 5;
  string model = 6;
  bool identity_verified = 7;
}
message DiscoverMotorsRequest { bool refresh = 1; }
message DiscoverMotorsResponse {
  bool ok = 1;
  optional string error = 2;
  repeated MotorIdentity motors = 3;
}
message DriverState {
  Header header = 1;
  OperatingMode mode = 2;
  bool session_owned = 3;
  bool profile_valid = 4;
  bool calibrated = 5;
  bool all_motors_online = 6;
  bool feedback_fresh = 7;
  bool fault_latched = 8;
  uint32 fault_code = 9;
  string fault_reason = 10;
  float command_age_s = 11;
  float feedback_age_s = 12;
  repeated MotorIdentity motors = 13;
}

