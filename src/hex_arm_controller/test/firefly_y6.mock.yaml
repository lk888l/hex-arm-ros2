joint_coordinate_version: 2
validated: true
calibrated: true
robot_prefix: hexmeow/wsl/firefly_y6_test
urdf_path: /workspaces/hex_arm_ros2/install/xpkg_urdf_firefly_y6/share/xpkg_urdf_firefly_y6/urdf/xpkg_urdf_firefly_y6.urdf
gravity_vector_base_m_s2: [0.0, 0.0, -9.81]
tip_payload: null

bus:
  transport: gs_usb
  interface: ""
  channel: 0
  adapter_vid: 65535
  adapter_pid: 65535
  heartbeat_node_id: 127
  hardware_timestamp: false
  auxiliary_node_ids: []
  # userspace gs_usb opens its own impossible mock VID/PID; SocketCAN
  # expected_link preflight is intentionally not applicable to this fixture.
  expected_link: null

controller:
  loop_hz: 1000
  state_publish_hz: 100
  discovery_timeout_ms: 500
  feedback_timeout_ms: 100
  command_watchdog_ms: 100

