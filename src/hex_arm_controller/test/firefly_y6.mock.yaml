gravity_vector_base_m_s2: [0.0, 0.0, -9.81]
tip_payload: null

bus:
  protocol: meow
  transport: socket_can
  interface: can_mock
  channel: 0
  adapter_vid: 4617
  adapter_pid: 8995
  heartbeat_node_id: 127
  hardware_timestamp: false
  auxiliary_node_ids: []
  # MockBackend skips CAN; this interface/serial binding rejects real I/O.
  expected_link:
    nominal_bitrate: 1000000
    nominal_sample_point_permille: 800
    nominal_sjw: 5
    data_bitrate: 4000000
    data_sample_point_permille: 800
    data_sjw: 3
    fd: true
    restart_ms: 0
    adapter:
      driver: gs_usb
      vendor_id: 4617
      product_id: 8995
      serial: "00000000000000000000000000000000"
      channel: 0

controller:
  loop_hz: 1000
  state_publish_hz: 100
  discovery_timeout_ms: 500
  feedback_timeout_ms: 100
  command_watchdog_ms: 100

