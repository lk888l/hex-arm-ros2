# Meow latest-firmware commissioning template; rejected until validated/calibrated.
# Reference: hex-gui/src/sixMotorMitTest.ts:13-25,38-70 (inspected 2026-09-05).
# MIT is uncompressed 0x4102 at 500 Hz, selected by 0x4103:01=0.
# Physical folded park q=[0,-1.57,3.14,0,0,0] rad corresponds to encoder Rev:
# [0.000269,0.249714,0.251193,-0.00159,-0.004028,0.000018].
# zero_offset_rad = park_q - direction * 2*pi * park_encoder_rev.
# These are installation-specific references. After power-cycle or encoder change,
# use fresh read-only readings at that exact physical pose with:
# scripts/import-gui-mit-profile.py --profile <base.yaml> --output <new.local.yaml>
#   --park-positions-rev M1 M2 M3 M4 M5 M6
# Replace every identity/adapter placeholder from read-only discovery.
# torque_scale=1: the Meow backend reads physical torque calibration from 0x4001.
# GUI Kp=80 Nm/rad, Kd=15 Nm*s/rad, PD limit=500 permille, total=650 permille.
# GUI velocity/acceleration 0.2 Rev/s and 0.2 Rev/s^2 are reference capabilities;
# begin supervised commissioning with the existing 0.1 rad/s MoveIt limits.
# torque_nm below bounds host feed-forward; read motor 0x4576 to check that
# the total raw torque budget also leaves room for gravity plus PD.
# Keep the physically verified base gravity vector and payload model.
