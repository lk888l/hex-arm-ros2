services:
  ros2-jazzy-arm:
    # NVIDIA Container Toolkit injects its own device nodes. Clear the generic
    # Ubuntu /dev/dri mapping so NVIDIA-only hosts do not fail Compose device
    # validation before a headless or X11 launch starts.
    devices: !reset []
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,utility,compute
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
